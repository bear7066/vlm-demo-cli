[project]
name = "vlm-demo-cli"
version = "0.1.0"
description = "Stream a video to a vision-language model and watch its per-window responses live in the browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "boto3>=1.43.95",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    # Newer image processors (Gemma 4 among them) import torchvision transforms directly.
    "torchvision>=0.17",
    "transformers>=4.44",
    "accelerate>=0.33",
    "pillow>=10.0",
]

[project.scripts]
vlm-demo = "vlm_demo.cli:main"

# PyPI now ships torch built for CUDA 13, which dropped Volta (sm_70) and needs a 580+ driver.
# The x86_64 machines are V100s on a 12.x driver, so the gpu extra is pinned to the CUDA 12.6
# index there. The cu126 aarch64 wheels only ship sm_80/sm_90 kernels, which breaks Blackwell
# (GB10 / DGX Spark, sm_121) — aarch64 uses the default PyPI CUDA 13 wheels instead.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
